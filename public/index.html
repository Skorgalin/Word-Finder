<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Finder Game</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Arial;
  margin:0;
  padding:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#0f0f0f;
  color:#fff;
}
header{
  text-align:center;
  padding:10px;
  background:#111;
}
#login,#game{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
input,button{
  font-size:18px;
  margin:5px;
}
#foundItems,#ownerPanel{
  border:1px solid #444;
  padding:10px;
  margin-top:10px;
  width:90%;
  max-height:200px;
  overflow-y:auto;
  background:#222;
  display:none;
}
.announcement{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:black;
  padding:6px 10px;
  border:1px solid black;
  z-index:999;
}
.foundItem{
  border-bottom:1px solid #444;
  padding:4px;
}
.first{
  color:#0f0;
}

#ownerBtn{
  background:#b30000;
  color:#fff;
  border:1px solid #ff4d4d;
}
#ownerPanel{
  background:#000;
  border:2px solid #00ff66;
}
#ownerPanel input{
  border:1px solid #00ff66;
  background:#111;
  color:#fff;
}

</style>
</head>

<body>

<header>
  <h2>Word Finder Game</h2>
</header>

<!-- LOGIN -->
<div id="login">
  <input id="email" name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
  <input id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="Nickname" required>

  <button id="registerBtn">Registrieren</button>
  <button id="loginBtn" style="display:none;">Login</button>
</div>

<!-- GAME -->
<div id="game" style="display:none;">
  <input id="word" name="gameWord" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" placeholder="Wort eingeben">
  <button onclick="submitItem()">OK</button>

  <button onclick="toggleFound()">Found Items</button>
  <button id="ownerBtn" style="display:none;" onclick="askOwnerPassword()">Owner</button>
  <button onclick="logout()">Logout</button>

  <div id="foundItems"></div>

  <div id="supportPanel" style="margin-top:10px;display:none;">
    <h4>Support an Owner</h4>
    <input id="supportText" type="text" autocomplete="off" placeholder="Nachricht an Owner (z.B. Entbannungsantrag)">
    <button onclick="sendSupportMessage()">Senden</button>
    <div id="supportStatus"></div>
  </div>

  <div id="chatPanel" style="margin-top:10px;display:none;">
    <h4>Server Chat</h4>
    <div id="chatServerInfo"></div>
    <select id="chatServerSelect" style="display:none;"></select>
    <div id="chatMessages" style="max-height:180px;overflow:auto;border:1px solid #333;padding:6px;margin:6px 0;"></div>
    <input id="chatInput" type="text" autocomplete="off" placeholder="Chat Nachricht">
    <button onclick="sendChatMessage()">Chat senden</button>
  </div>

  <!-- OWNER PANEL -->
  <div id="ownerPanel">
    <h3>Owner Dashboard</h3>

    <div id="ownerAnnouncementSection">
      <input id="announceText" type="text" autocomplete="off" placeholder="Ankündigung">
      <button onclick="sendAnnouncement()">Senden</button>
      <hr>
    </div>

    <h4>Output Suche / Bearbeiten</h4>
    <input id="ownerSearchInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Output">
    <input id="ownerDesiredInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Gewünschter Input (optional)">
    <select id="ownerRaritySelect">
      <option value="">Seltenheit beibehalten/zufällig</option>
      <option value="common">COMMON</option>
      <option value="selten">SELTEN</option>
      <option value="legendär">LEGENDÄR</option>
      <option value="mythisch">MYTHISCH</option>
      <option value="godly">GODLY</option>
    </select>
    <button onclick="ownerSearch()">Anwenden</button>
    <div id="ownerSearchResult"></div>

    <hr>

    <button onclick="loadPlayers()">Spieler verwalten</button>
    <button onclick="loadSuspectPlayers()">Suspect Player</button>
    <div id="playersList"></div>
    <div id="suspectPlayersList"></div>

    <hr>

    <div id="ownerOnlyPanel">
      <h4>Admin ernennen</h4>
      <input id="grantAdminEmail" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="E-Mail für Admin Rechte">
      <button onclick="grantAdmin()">Admin ernennen</button>
      <div id="grantAdminResult"></div>

      <h4>Admin Ränge verwalten</h4>
      <input id="roleTargetEmail" type="email" autocomplete="off" placeholder="E-Mail des Admin/Mods">
      <button onclick="setUserRole('player')">Zu Spieler</button>
      <button onclick="setUserRole('moderator')">Zu Moderator</button>
      <button onclick="setUserRole('admin')">Zu Admin</button>
      <div id="roleResult"></div>
      <hr>
    </div>

    <h4>Gebannte Spieler</h4>
    <button onclick="loadBannedPlayers()">Gebannte laden</button>
    <div id="bannedPlayersList"></div>

    <hr>

    <h4>Support-Nachrichten</h4>
    <div id="ownerSupportInbox"></div>

    <hr>

    <div id="spectatePanel" style="display:none; border:1px solid #555; padding:8px; margin-top:8px;">
      <h4 id="spectateTitle">Spectate</h4>
      <div><strong>Live Input:</strong> <span id="spectateTyping">-</span></div>
      <div><strong>Letzter Fund:</strong> <span id="spectateFound">-</span></div>
      <button onclick="stopSpectate()">Spectate stoppen</button>
    </div>
  </div>
</div>

<div id="announcements"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="player.js"></script>

<script>
/* =================================================
   BASIS
   ================================================= */
const socket = window.playerSocket || io();

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const nicknameInput = document.getElementById("nickname");
const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");

let email = "";
let nickname = "";
let isOwner = false;
let isAdmin = false;
let isModerator = false;
let ownerUnlocked = false;
let assignedChatServer = null;

const gameFoundSet = new Set(); // Für Found Items ohne Duplikate

function emitOnlinePresence(){
  if(!email) return;
  socket.emit("player:online", { email, owner: isOwner, admin: isAdmin, moderator: isModerator, nickname });
}

socket.on("connect", ()=>{
  emitOnlinePresence();
});

/* =================================================
   EMAIL CHECK
   ================================================= */
emailInput.addEventListener("input", ()=>{
  if(!emailInput.value) return;

  fetch("/checkEmail",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ email: emailInput.value })
  })
  .then(r=>r.json())
  .then(d=>{
    loginBtn.style.display = d.exists ? "inline" : "none";
    registerBtn.style.display = d.exists ? "none" : "inline";
  });
});

/* =================================================
   REGISTER
   ================================================= */
function setAuthButtonsDisabled(disabled){
  registerBtn.disabled = disabled;
  loginBtn.disabled = disabled;
}

registerBtn.onclick = async ()=>{
  const enteredEmail = emailInput.value.trim();
  const enteredPassword = passwordInput.value;
  const enteredNickname = nicknameInput.value.trim();

  if(!enteredEmail || !enteredPassword || !enteredNickname){
    alert("Bitte E-Mail, Passwort und Nickname eingeben.");
    return;
  }

  setAuthButtonsDisabled(true);

  try {
    const registerResponse = await fetch("/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email: enteredEmail,
        password: enteredPassword,
        nickname: enteredNickname
      })
    });

    const registerData = await registerResponse.json();

    if(registerData.ok){
      enterGame(registerData.owner, registerData.admin, registerData.moderator, registerData.nickname || enteredNickname);
      return;
    }

    // Falls der User bereits existiert, direkt als Login versuchen,
    // damit der Registrieren-Button ebenfalls ins Spiel führt.
    if(registerData.error === "exists"){
      const loginResponse = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          email: enteredEmail,
          password: enteredPassword,
          nickname: enteredNickname
        })
      });

      const loginData = await loginResponse.json();
      if(loginData.ok){
        enterGame(loginData.owner, loginData.admin, loginData.moderator, loginData.nickname || enteredNickname);
      } else {
        alert("Account existiert bereits. Bitte korrekt einloggen.");
      }
      return;
    }

    alert(registerData.error || "Registrierung fehlgeschlagen");
  } catch (error) {
    console.error("Register/Login-Flow Fehler:", error);
    alert("Verbindungsfehler. Bitte erneut versuchen.");
  } finally {
    setAuthButtonsDisabled(false);
  }
};

/* =================================================
   LOGIN
   ================================================= */
loginBtn.onclick = async ()=>{
  const enteredEmail = emailInput.value.trim();
  const enteredPassword = passwordInput.value;
  const enteredNickname = nicknameInput.value.trim();

  if(!enteredEmail || !enteredPassword || !enteredNickname){
    alert("Bitte E-Mail, Passwort und Nickname eingeben.");
    return;
  }

  setAuthButtonsDisabled(true);

  try {
    const response = await fetch("/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email: enteredEmail,
        password: enteredPassword,
        nickname: enteredNickname
      })
    });

    const data = await response.json();

    if(data.ok){
      enterGame(data.owner, data.admin, data.moderator, data.nickname || enteredNickname);
    } else {
      alert(data.error || "Falsches Passwort");
    }
  } catch (error) {
    console.error("Login Fehler:", error);
    alert("Verbindungsfehler. Bitte erneut versuchen.");
  } finally {
    setAuthButtonsDisabled(false);
  }
};

/* =================================================
   ENTER GAME
   ================================================= */
function enterGame(owner, admin, moderator, nick){
  email = emailInput.value;
  nickname = nick || nicknameInput.value.trim() || email.split("@")[0];
  const OWNER_EMAIL = "till.behner@icloud.com";
  isOwner = owner || email === OWNER_EMAIL;
  isAdmin = admin || isOwner;
  isModerator = moderator || isAdmin || isOwner;
  ownerUnlocked = false;

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="flex";

  if(isOwner || isAdmin){
    const ownerBtn = document.getElementById("ownerBtn");
    ownerBtn.style.display="inline";
    ownerBtn.textContent = isOwner ? "Owner" : "Admin";
  }

  if(!isOwner){
    document.getElementById("supportPanel").style.display = "block";
  }
  document.getElementById("chatServerSelect").style.display = (isOwner || isAdmin || isModerator) ? "inline" : "none";

  document.getElementById("chatPanel").style.display = "block";
  document.getElementById("chatServerSelect").style.display = (isOwner || isAdmin || isModerator) ? "inline" : "none";

  initPlayer(email,{ owner: isOwner, admin: isAdmin, moderator: isModerator, nickname });
  emitOnlinePresence();

  emailInput.value="";
  passwordInput.value="";
  nicknameInput.value="";
}

/* =================================================
   LOGOUT
   ================================================= */
function logout(){
  socket.emit("owner:spectateStop");
  socket.emit("player:offline",{ email });
  location.reload();
}

/* =================================================
   WORD FINDER
   ================================================= */
function rarityLabel(rarity){
  return (rarity || "common").toUpperCase();
}

function showItemNotification(input, output, rarity, firstDiscovery){
  const ann=document.createElement("div");
  ann.className="announcement";
  ann.textContent = `${input} → ${output} [${rarityLabel(rarity)}]${firstDiscovery ? " (First Discovery)" : ""}`;
  document.getElementById("announcements").appendChild(ann);
  setTimeout(()=>ann.remove(),5000);
}

function submitItem(){
  const input = document.getElementById("word").value.trim();
  if(!input) return;

  fetch("/submitItem",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ email, input })
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.ok){
      if(d.error === "banned"){
        alert(`Du bist gebannt${d.permanent ? " (Permanent)" : ` (${d.remaining}s verbleibend)`}.`);
      }
      return;
    }

    const key = d.input + "->" + d.output;

    // Spieler darf denselben Input mehrfach eingeben.
    // Found Items bleibt trotzdem einzigartig pro input->output.
    if(!gameFoundSet.has(key)){
      gameFoundSet.add(key);

      notifyItemFound(d.input, d.output);

      const div = document.createElement("div");
      div.className="foundItem";
      div.innerHTML =
        d.input+" → "+d.output+" ["+rarityLabel(d.rarity)+"]"+
        (d.firstDiscovery ? " <span class='first'>(First Discovery)</span>" : "");

      document.getElementById("foundItems").prepend(div);
    }

    // Notification bei jedem erfolgreichen Submit anzeigen.
    showItemNotification(d.input, d.output, d.rarity, d.firstDiscovery);
    document.getElementById("word").value="";
  });
}

function toggleFound(){
  const f=document.getElementById("foundItems");
  f.style.display = f.style.display==="none"?"block":"none";
}

function sendSupportMessage(){
  if(!email) return;
  const input=document.getElementById("supportText");
  const status=document.getElementById("supportStatus");
  const text=(input.value || "").trim();
  if(!text) return;
  socket.emit("support:message", { from: email, nickname, text });
  input.value = "";
  status.textContent = "Nachricht gesendet.";
}

/* =================================================
   OWNER
   ================================================= */
function askOwnerPassword(){
  const panel = document.getElementById("ownerPanel");

  if(ownerUnlocked){
    panel.style.display = panel.style.display==="none"?"block":"none";
    return;
  }

  if(!isOwner){
    ownerUnlocked=true;
    panel.style.display="block";
    document.getElementById("ownerOnlyPanel").style.display = "none";
    document.getElementById("ownerAnnouncementSection").style.display = isModerator ? "block" : "none";
    return;
  }

  const pw = prompt("Owner Passwort:");
  if(pw==="X9$QvR7!eM2#A8wK@C"){
    ownerUnlocked=true;
    panel.style.display="block";
    document.getElementById("ownerOnlyPanel").style.display = isOwner ? "block" : "none";
    document.getElementById("ownerAnnouncementSection").style.display = (isOwner || isModerator) ? "block" : "none";
  } else {
    alert("Falsches Passwort");
  }
}

/* =================================================
   ANNOUNCEMENTS
   ================================================= */
function sendAnnouncement(){
  if(!ownerUnlocked || (!isOwner && !isModerator)) return;
  const text=document.getElementById("announceText").value;
  socket.emit("ownerAnnouncement",{text});
  document.getElementById("announceText").value="";
}

socket.on("announcement",data=>{
  const ann=document.createElement("div");
  ann.className="announcement";
  ann.textContent=data.text;
  document.getElementById("announcements").appendChild(ann);
  setTimeout(()=>ann.remove(),5000);
});

/* =================================================
   OWNER SEARCH
   ================================================= */
function ownerSearch(){
  if(!ownerUnlocked || (!isOwner && !isAdmin)) return;

  const output = document.getElementById("ownerSearchInput").value.trim();
  const desiredInput = document.getElementById("ownerDesiredInput").value.trim();
  const rarity = document.getElementById("ownerRaritySelect").value;

  fetch("/ownerSearch",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ output, desiredInput, rarity })
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.ok){
      document.getElementById("ownerSearchResult").textContent = "Fehler bei der Output-Suche.";
      return;
    }

    const status = d.created ? "neu erstellt" : "aktualisiert";
    document.getElementById("ownerSearchResult").textContent =
      `${d.input} → ${d.output} [${rarityLabel(d.rarity)}] (${status})`;
  });
}

/* =================================================
   SPIELER VERWALTEN
   ================================================= */
let currentSpectateEmail = "";

function loadSuspectPlayers(){
  if(!ownerUnlocked || (!isOwner && !isAdmin && !isModerator)) return;
  socket.emit("owner:getSuspectPlayers");
}

function createPlayerActionRow(displayText, metaText, targetEmail){
  const row=document.createElement("div");
  row.style.border = "1px solid #555";
  row.style.padding = "6px";
  row.style.marginBottom = "6px";

  const label=document.createElement("div");
  label.textContent = displayText;

  const meta=document.createElement("div");
  meta.style.fontSize = "14px";
  meta.style.opacity = "0.85";
  meta.textContent = metaText;

  const spectateBtn=document.createElement("button");
  spectateBtn.textContent="Spectate";
  spectateBtn.onclick=()=>startSpectate(targetEmail);

  const banBtn=document.createElement("button");
  banBtn.textContent="Bannen";
  const protectedRole = String(metaText).toLowerCase().includes("owner") || String(metaText).toLowerCase().includes("admin");
  if(protectedRole){
    banBtn.disabled = true;
  }
  banBtn.onclick=()=>openBanDialog(targetEmail);

  row.appendChild(label);
  row.appendChild(meta);
  row.appendChild(spectateBtn);
  row.appendChild(banBtn);
  return row;
}

function loadPlayers(){
  if(!ownerUnlocked || (!isOwner && !isAdmin && !isModerator)) return;
  socket.emit("owner:getPlayers");
}

function openBanDialog(playerEmail){
  if(!ownerUnlocked) return;

  const reason = prompt("Grund für Bann:", "Regelverstoß") || "";
  if(!reason.trim()){
    alert("Bitte einen Grund angeben.");
    return;
  }

  const mode = prompt("Bann-Dauer wählen: day / hour / minute / permanent", "minute");
  if(!mode) return;

  const normalizedMode = mode.trim().toLowerCase();
  let duration = null;

  if(normalizedMode === "permanent"){
    duration = null;
  } else {
    const amountStr = prompt("Wie viele Einheiten?", "10");
    const amount = parseInt(amountStr,10);
    if(!amount || amount < 1){
      alert("Ungültige Anzahl.");
      return;
    }

    if(normalizedMode === "day") duration = amount * 24 * 60 * 60;
    else if(normalizedMode === "hour") duration = amount * 60 * 60;
    else if(normalizedMode === "minute") duration = amount * 60;
    else {
      alert("Ungültige Dauer. Erlaubt: day / hour / minute / permanent");
      return;
    }
  }

  socket.emit("owner:banPlayer", { email: playerEmail, reason: reason.trim(), duration });
}

function startSpectate(playerEmail){
  if(!ownerUnlocked) return;
  currentSpectateEmail = playerEmail;
  socket.emit("owner:spectateStart", { email: playerEmail });

  document.getElementById("spectatePanel").style.display = "block";
  document.getElementById("spectateTitle").textContent = `Spectate: ${playerEmail}`;
  document.getElementById("spectateTyping").textContent = "-";
  document.getElementById("spectateFound").textContent = "-";
}

function stopSpectate(){
  socket.emit("owner:spectateStop");
  currentSpectateEmail = "";
  document.getElementById("spectatePanel").style.display = "none";
}


function grantAdmin(){
  if(!ownerUnlocked || !isOwner) return;
  const grantEmail = document.getElementById("grantAdminEmail").value.trim().toLowerCase();
  if(!grantEmail) return;
  socket.emit("owner:grantAdmin", { email: grantEmail });
}

function setUserRole(role){
  if(!ownerUnlocked || !isOwner) return;
  const targetEmail = document.getElementById("roleTargetEmail").value.trim().toLowerCase();
  if(!targetEmail) return;
  socket.emit("owner:setUserRole", { email: targetEmail, role });
}

function loadBannedPlayers(){
  if(!ownerUnlocked || (!isOwner && !isAdmin && !isModerator)) return;
  socket.emit("owner:getBannedPlayers");
}

function unbanPlayer(playerEmail){
  if(!ownerUnlocked || (!isOwner && !isAdmin && !isModerator)) return;
  socket.emit("owner:unbanPlayer", { email: playerEmail });
}

socket.on("owner:grantAdminResult", (data)=>{
  const box=document.getElementById("grantAdminResult");
  box.textContent = data.ok
    ? `${data.email} ist jetzt Admin.`
    : `Fehler: ${data.error || "Unbekannt"}`;
});

socket.on("owner:setUserRoleResult", (data)=>{
  const box=document.getElementById("roleResult");
  box.textContent = data.ok
    ? `${data.email} wurde zu ${data.role}.`
    : `Fehler: ${data.error || "Unbekannt"}`;
});

socket.on("owner:banError", (data)=>{
  alert(data.error || "Bann fehlgeschlagen");
});

socket.on("owner:banAudit", (data)=>{
  if(!isOwner) return;
  const latest = (data.recentActions || [])
    .map(a => `${a.input} → ${a.output} [${a.rarity}]`)
    .join(" | ");

  const text = `Admin-Bann: ${data.by} bannte ${data.target}. Grund: ${data.reason}. Dauer: ${data.permanent ? "Permanent" : data.duration + "s"}. Letzte Inputs: ${latest || "-"}`;
  const ann=document.createElement("div");
  ann.className="announcement";
  ann.textContent = text;
  document.getElementById("announcements").appendChild(ann);
  setTimeout(()=>ann.remove(),10000);
});

socket.on("owner:bannedPlayers", (players)=>{
  const list=document.getElementById("bannedPlayersList");
  list.innerHTML = "";

  if(!players.length){
    list.textContent = "Niemand ist aktuell gebannt.";
    return;
  }

  players.forEach(p=>{
    const row=document.createElement("div");
    row.style.border = "1px solid #555";
    row.style.padding = "6px";
    row.style.marginBottom = "6px";
    row.textContent = `${p.email} | Grund: ${p.reason} | Dauer: ${p.permanent ? "Permanent" : `${p.remaining}s`}`;

    const btn=document.createElement("button");
    btn.textContent = "Entbannen";
    btn.onclick = ()=>unbanPlayer(p.email);
    row.appendChild(btn);

    list.appendChild(row);
  });
});

socket.on("owner:unbanResult", (data)=>{
  if(data.ok){
    loadBannedPlayers();
  } else {
    alert(data.error || "Entbannen fehlgeschlagen");
  }
});

socket.on("owner:playersList",(players)=>{
  const list=document.getElementById("playersList");
  list.innerHTML="";

  if(!players.length){
    list.textContent = "Keine Spieler online.";
    return;
  }

  players.forEach(p=>{
    const roleText = p.owner ? "Owner" : (p.admin ? "Admin" : (p.moderator ? "Moderator" : "Spieler"));
    const label = p.emailVisible ? `${p.nickname} (${p.email})` : p.nickname;
    list.appendChild(createPlayerActionRow(label, roleText, p.email));
  });
});

socket.on("owner:suspectPlayers",(suspects)=>{
  const list=document.getElementById("suspectPlayersList");
  list.innerHTML = "";

  if(!suspects.length){
    list.textContent = "Keine verdächtigen Spieler gefunden.";
    return;
  }

  const title=document.createElement("h4");
  title.textContent = "Suspect Player";
  list.appendChild(title);

  suspects.forEach(player=>{
    const meta = `Rare: ${player.rareCount} | Leg: ${player.legendärCount} | Myth: ${player.mythischCount} | Godly: ${player.godlyCount} | Score: ${player.score}`;
    list.appendChild(createPlayerActionRow(player.email, meta, player.email));
  });
});

socket.on("spectate:typing",({ email: typingEmail, text })=>{
  if(!currentSpectateEmail || currentSpectateEmail !== typingEmail) return;
  document.getElementById("spectateTyping").textContent = text || "(leer)";
});

socket.on("spectate:itemFound",({ email: foundEmail, input, output })=>{
  if(!currentSpectateEmail || currentSpectateEmail !== foundEmail) return;
  document.getElementById("spectateFound").textContent = `${input} → ${output}`;
});

socket.on("owner:mappingUpdated", (data)=>{
  const items = document.querySelectorAll("#foundItems .foundItem");
  items.forEach((item)=>{
    const text = item.textContent || "";
    const hasOutput = text.includes(`→ ${data.output}`);
    const oldInputMatch = !data.oldInput || text.includes(`${data.oldInput} →`);
    if(hasOutput && oldInputMatch){
      const hadFirst = text.includes("First Discovery");
      item.innerHTML = `${data.newInput} → ${data.output} [${rarityLabel(data.rarity)}]${hadFirst ? ' <span class="first">(First Discovery)</span>' : ''}`;
      gameFoundSet.delete(`${data.oldInput}->${data.output}`);
      gameFoundSet.add(`${data.newInput}->${data.output}`);
    }
  });
});

socket.on("owner:supportMessage", (msg)=>{
  if(!isOwner) return;
  const inbox = document.getElementById("ownerSupportInbox");
  const row = document.createElement("div");
  row.style.border = "1px solid #2a2";
  row.style.padding = "6px";
  row.style.marginBottom = "6px";
  row.textContent = `[${new Date(msg.at || Date.now()).toLocaleTimeString()}] ${msg.nickname || msg.from}${msg.isAdmin ? " (Admin)" : ""}: ${msg.text}`;
  inbox.prepend(row);
});

socket.on("support:sent", ()=>{
  const status=document.getElementById("supportStatus");
  if(status) status.textContent = "Nachricht wurde an Owner gesendet.";
});

socket.on("player:roleUpdated", (role)=>{
  isOwner = !!role.owner;
  isAdmin = !!role.admin || isOwner;
  isModerator = !!role.moderator || isAdmin || isOwner;

  const ownerBtn = document.getElementById("ownerBtn");
  if(isOwner || isAdmin){
    ownerBtn.style.display = "inline";
    ownerBtn.textContent = isOwner ? "Owner" : "Admin";
  }

  if(!isOwner){
    document.getElementById("supportPanel").style.display = "block";
  }
  document.getElementById("chatServerSelect").style.display = (isOwner || isAdmin || isModerator) ? "inline" : "none";
});

function sendChatMessage(){
  if(!email) return;
  const input=document.getElementById("chatInput");
  const text=(input.value || "").trim();
  if(!text) return;
  const selected=document.getElementById("chatServerSelect").value || assignedChatServer;
  socket.emit("chat:send", { text, serverId: selected });
  input.value="";
}

socket.on("chat:assignedServer", ({ serverId })=>{
  assignedChatServer = serverId;
  const info=document.getElementById("chatServerInfo");
  info.textContent = `Dein Chat-Server: ${serverId}`;
  const sel=document.getElementById("chatServerSelect");
  if(sel && !sel.value) sel.value = serverId;
});

socket.on("chat:serverList", (servers)=>{
  const sel=document.getElementById("chatServerSelect");
  const current=sel.value;
  sel.innerHTML="";
  (servers || []).forEach((s)=>{
    const opt=document.createElement("option");
    opt.value=s;
    opt.textContent=s;
    sel.appendChild(opt);
  });
  if(current && (servers || []).includes(current)) sel.value=current;
  else if(assignedChatServer && (servers || []).includes(assignedChatServer)) sel.value=assignedChatServer;
});

socket.on("chat:message", (msg)=>{
  const box=document.getElementById("chatMessages");
  const row=document.createElement("div");
  row.textContent = `[${msg.serverId}] ${msg.nickname}: ${msg.text}`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
});

</script>
