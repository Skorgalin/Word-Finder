<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Finder Game</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family:Arial;
  margin:0;
  padding:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#0f0f0f;
  color:#fff;
}
header{
  text-align:center;
  padding:10px;
  background:#111;
}
#login,#game{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
input,button{
  font-size:18px;
  margin:5px;
}
#foundItems,#adminPanel{
  border:1px solid #444;
  padding:10px;
  margin-top:10px;
  width:90%;
  max-height:200px;
  overflow-y:auto;
  background:#222;
  display:none;
}
.announcement{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:black;
  padding:6px 10px;
  border:1px solid black;
  z-index:999;
}
.foundItem{
  border-bottom:1px solid #444;
  padding:4px;
}
.first{
  color:#0f0;
}
</style>
</head>

<body>

<header>
  <h2>Word Finder Game</h2>
</header>

<!-- LOGIN -->
<div id="login">
  <input id="email" name="email" type="email" autocomplete="email" placeholder="E-Mail" required>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>

  <button id="registerBtn">Registrieren</button>
  <button id="loginBtn" style="display:none;">Login</button>
</div>

<!-- GAME -->
<div id="game" style="display:none;">
  <input id="word" name="gameWord" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Wort eingeben">
  <button onclick="submitItem()">OK</button>

  <button onclick="toggleFound()">Found Items</button>
  <button id="adminBtn" style="display:none;" onclick="askAdminPassword()">Admin</button>
  <button onclick="logout()">Logout</button>

  <div id="foundItems"></div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel">
    <h3>Admin Dashboard</h3>

    <input id="announceText" placeholder="Ankündigung">
    <button onclick="sendAnnouncement()">Senden</button>

    <hr>

    <input id="adminSearchInput" placeholder="Input">
    <button onclick="adminSearch()">OK</button>
    <div id="adminSearchResult"></div>

    <hr>

    <button onclick="loadPlayers()">Spieler verwalten</button>
    <div id="playersList"></div>

    <hr>

    <div id="spectatePanel" style="display:none; border:1px solid #555; padding:8px; margin-top:8px;">
      <h4 id="spectateTitle">Spectate</h4>
      <div><strong>Live Input:</strong> <span id="spectateTyping">-</span></div>
      <div><strong>Letzter Fund:</strong> <span id="spectateFound">-</span></div>
      <button onclick="stopSpectate()">Spectate stoppen</button>
    </div>
  </div>
</div>

<div id="announcements"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="player.js"></script>

<script>
/* =================================================
   BASIS
   ================================================= */
const socket = io();

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");

let email = "";
let isAdmin = false;
let adminUnlocked = false;

const gameFoundSet = new Set(); // Für Found Items ohne Duplikate

/* =================================================
   EMAIL CHECK
   ================================================= */
emailInput.addEventListener("input", ()=>{
  if(!emailInput.value) return;

  fetch("/checkEmail",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ email: emailInput.value })
  })
  .then(r=>r.json())
  .then(d=>{
    loginBtn.style.display = d.exists ? "inline" : "none";
    registerBtn.style.display = d.exists ? "none" : "inline";
  });
});

/* =================================================
   REGISTER
   ================================================= */
function setAuthButtonsDisabled(disabled){
  registerBtn.disabled = disabled;
  loginBtn.disabled = disabled;
}

registerBtn.onclick = async ()=>{
  const enteredEmail = emailInput.value.trim();
  const enteredPassword = passwordInput.value;

  if(!enteredEmail || !enteredPassword){
    alert("Bitte E-Mail und Passwort eingeben.");
    return;
  }

  setAuthButtonsDisabled(true);

  try {
    const registerResponse = await fetch("/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email: enteredEmail,
        password: enteredPassword
      })
    });

    const registerData = await registerResponse.json();

    if(registerData.ok){
      enterGame(registerData.admin);
      return;
    }

    // Falls der User bereits existiert, direkt als Login versuchen,
    // damit der Registrieren-Button ebenfalls ins Spiel führt.
    if(registerData.error === "exists"){
      const loginResponse = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          email: enteredEmail,
          password: enteredPassword
        })
      });

      const loginData = await loginResponse.json();
      if(loginData.ok){
        enterGame(loginData.admin);
      } else {
        alert("Account existiert bereits. Bitte korrekt einloggen.");
      }
      return;
    }

    alert("Registrierung fehlgeschlagen");
  } catch (error) {
    console.error("Register/Login-Flow Fehler:", error);
    alert("Verbindungsfehler. Bitte erneut versuchen.");
  } finally {
    setAuthButtonsDisabled(false);
  }
};

/* =================================================
   LOGIN
   ================================================= */
loginBtn.onclick = async ()=>{
  const enteredEmail = emailInput.value.trim();
  const enteredPassword = passwordInput.value;

  if(!enteredEmail || !enteredPassword){
    alert("Bitte E-Mail und Passwort eingeben.");
    return;
  }

  setAuthButtonsDisabled(true);

  try {
    const response = await fetch("/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email: enteredEmail,
        password: enteredPassword
      })
    });

    const data = await response.json();

    if(data.ok){
      enterGame(data.admin);
    } else {
      alert("Falsches Passwort");
    }
  } catch (error) {
    console.error("Login Fehler:", error);
    alert("Verbindungsfehler. Bitte erneut versuchen.");
  } finally {
    setAuthButtonsDisabled(false);
  }
};

/* =================================================
   ENTER GAME
   ================================================= */
function enterGame(admin){
  email = emailInput.value;
  isAdmin = admin || email === "till.behner@icloud.com";
  adminUnlocked = false;

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="flex";

  if(isAdmin){
    document.getElementById("adminBtn").style.display="inline";
  }

  initPlayer(email);

  emailInput.value="";
  passwordInput.value="";
}

/* =================================================
   LOGOUT
   ================================================= */
function logout(){
  socket.emit("player:offline",{ email });
  location.reload();
}

/* =================================================
   WORD FINDER
   ================================================= */
function showItemNotification(input, output, firstDiscovery){
  const ann=document.createElement("div");
  ann.className="announcement";
  ann.textContent = `${input} → ${output}${firstDiscovery ? " (First Discovery)" : ""}`;
  document.getElementById("announcements").appendChild(ann);
  setTimeout(()=>ann.remove(),5000);
}

function submitItem(){
  const input = document.getElementById("word").value.trim();
  if(!input) return;

  fetch("/submitItem",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ email, input })
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.ok) return;

    const key = d.input + "->" + d.output;

    // Spieler darf denselben Input mehrfach eingeben.
    // Found Items bleibt trotzdem einzigartig pro input->output.
    if(!gameFoundSet.has(key)){
      gameFoundSet.add(key);

      notifyItemFound(d.input, d.output);

      const div = document.createElement("div");
      div.className="foundItem";
      div.innerHTML =
        d.input+" → "+d.output+
        (d.firstDiscovery ? " <span class='first'>(First Discovery)</span>" : "");

      document.getElementById("foundItems").prepend(div);
    }

    // Notification bei jedem erfolgreichen Submit anzeigen.
    showItemNotification(d.input, d.output, d.firstDiscovery);
    document.getElementById("word").value="";
  });
}

function toggleFound(){
  const f=document.getElementById("foundItems");
  f.style.display = f.style.display==="none"?"block":"none";
}

/* =================================================
   ADMIN
   ================================================= */
function askAdminPassword(){
  if(adminUnlocked){
    adminPanel.style.display =
      adminPanel.style.display==="none"?"block":"none";
    return;
  }

  const pw = prompt("Admin Passwort:");
  if(pw==="X9$QvR7!eM2#A8wK@C"){
    adminUnlocked=true;
    document.getElementById("adminPanel").style.display="block";
  } else {
    alert("Falsches Passwort");
  }
}

/* =================================================
   ANNOUNCEMENTS
   ================================================= */
function sendAnnouncement(){
  if(!adminUnlocked) return;
  const text=document.getElementById("announceText").value;
  socket.emit("adminAnnouncement",{text});
  document.getElementById("announceText").value="";
}

socket.on("announcement",data=>{
  const ann=document.createElement("div");
  ann.className="announcement";
  ann.textContent=data.text;
  document.getElementById("announcements").appendChild(ann);
  setTimeout(()=>ann.remove(),5000);
});

/* =================================================
   ADMIN SEARCH
   ================================================= */
function adminSearch(){
  const query=document.getElementById("adminSearchInput").value;

  fetch("/adminSearch",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ query })
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.ok){
      document.getElementById("adminSearchResult").textContent =
        d.input+" → "+d.output;
    }
  });
}

/* =================================================
   SPIELER VERWALTEN
   ================================================= */
let currentSpectateEmail = "";

function loadPlayers(){
  if(!adminUnlocked) return;
  socket.emit("admin:getPlayers");
}

function openBanDialog(playerEmail){
  if(!adminUnlocked) return;

  const reason = prompt("Grund für Bann:", "Regelverstoß") || "";
  if(!reason.trim()){
    alert("Bitte einen Grund angeben.");
    return;
  }

  const mode = prompt("Bann-Dauer wählen: day / hour / minute / permanent", "minute");
  if(!mode) return;

  const normalizedMode = mode.trim().toLowerCase();
  let duration = null;

  if(normalizedMode === "permanent"){
    duration = null;
  } else {
    const amountStr = prompt("Wie viele Einheiten?", "10");
    const amount = parseInt(amountStr,10);
    if(!amount || amount < 1){
      alert("Ungültige Anzahl.");
      return;
    }

    if(normalizedMode === "day") duration = amount * 24 * 60 * 60;
    else if(normalizedMode === "hour") duration = amount * 60 * 60;
    else if(normalizedMode === "minute") duration = amount * 60;
    else {
      alert("Ungültige Dauer. Erlaubt: day / hour / minute / permanent");
      return;
    }
  }

  socket.emit("admin:banPlayer", { email: playerEmail, reason: reason.trim(), duration });
}

function startSpectate(playerEmail){
  if(!adminUnlocked) return;
  currentSpectateEmail = playerEmail;
  socket.emit("admin:spectateStart", { email: playerEmail });

  document.getElementById("spectatePanel").style.display = "block";
  document.getElementById("spectateTitle").textContent = `Spectate: ${playerEmail}`;
  document.getElementById("spectateTyping").textContent = "-";
  document.getElementById("spectateFound").textContent = "-";
}

function stopSpectate(){
  socket.emit("admin:spectateStop");
  currentSpectateEmail = "";
  document.getElementById("spectatePanel").style.display = "none";
}

socket.on("admin:playersList",(players)=>{
  const list=document.getElementById("playersList");
  list.innerHTML="";

  if(!players.length){
    list.textContent = "Keine Spieler online.";
    return;
  }

  players.forEach(p=>{
    const row=document.createElement("div");
    row.style.border = "1px solid #555";
    row.style.padding = "6px";
    row.style.marginBottom = "6px";

    const label=document.createElement("div");
    label.textContent=p.email;

    const spectateBtn=document.createElement("button");
    spectateBtn.textContent="Spectate";
    spectateBtn.onclick=()=>startSpectate(p.email);

    const banBtn=document.createElement("button");
    banBtn.textContent="Bannen";
    banBtn.onclick=()=>openBanDialog(p.email);

    row.appendChild(label);
    row.appendChild(spectateBtn);
    row.appendChild(banBtn);
    list.appendChild(row);
  });
});

socket.on("spectate:typing",({ email: typingEmail, text })=>{
  if(!currentSpectateEmail || currentSpectateEmail !== typingEmail) return;
  document.getElementById("spectateTyping").textContent = text || "(leer)";
});

socket.on("spectate:itemFound",({ email: foundEmail, input, output })=>{
  if(!currentSpectateEmail || currentSpectateEmail !== foundEmail) return;
  document.getElementById("spectateFound").textContent = `${input} → ${output}`;
});

/* =================================================
   BAN SCREEN
   ================================================= */
socket.on("player:banned",(data)=>{
  document.body.innerHTML=`
    <div style="color:red;text-align:center;margin-top:40px">
      <h2>Du wurdest gebannt</h2>
      <p>${data.reason || ""}</p>
    </div>
  `;
});
</script>

</body>
</html>
